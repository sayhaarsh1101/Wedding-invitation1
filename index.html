<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harsh & Rutbi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:wght@300;400;500&display=swap">

<style>
/* Layout: 3-page physical book — centered on desktop, full-bleed on mobile */
:root {
  --ivory: #FAF7F2;
  --cream: #EDE8DF;
  --cream-deep: #E4DDD2;
  --gold: #A8873E;
  --gold-dark: #8B6F2E;
  --gold-light: #D9C9A3;
  --gold-faint: #E8DCC6;
  --maroon: #5E2636;
  --sage: #7E8E6E;
  --text: #2C1F1A;
  --text-light: #3D2E2A;
  --text-muted: #5C4D45;
  --paper-shadow: rgba(60, 40, 30, 0.15);
  --font-display: 'Cormorant Garamond', 'Georgia', 'Times New Roman', serif;
  --font-body: 'Jost', 'Helvetica Neue', Arial, sans-serif;
  padding: 0 !important;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ivory: #FAF7F2; --cream: #EDE8DF; --cream-deep: #E4DDD2;
    --gold: #A8873E; --gold-dark: #8B6F2E; --gold-light: #D9C9A3; --gold-faint: #E8DCC6;
    --maroon: #5E2636; --sage: #7E8E6E; --text: #3D2E2A;
    --text-light: #7A6B63; --text-muted: #A89B92;
    --paper-shadow: rgba(60, 40, 30, 0.15);
    color-scheme: light;
  }
}
:root[data-theme="dark"] {
  --ivory: #FAF7F2; --cream: #EDE8DF; --cream-deep: #E4DDD2;
  --gold: #A8873E; --gold-dark: #8B6F2E; --gold-light: #D9C9A3; --gold-faint: #E8DCC6;
  --maroon: #5E2636; --sage: #7E8E6E; --text: #3D2E2A;
  --text-light: #7A6B63; --text-muted: #A89B92;
  --paper-shadow: rgba(60, 40, 30, 0.15);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; }

body {
  background: var(--cream-deep);
  color: var(--text);
  font-family: var(--font-body);
  font-weight: 400;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  padding: 0 !important;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ==================== BOOK WRAPPER ==================== */
.book-scene {
  width: 100%;
  height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  perspective: 2400px;
}

.book {
  position: relative;
  width: 100%;
  max-width: 480px;
  height: 100dvh;
  max-height: 860px;
  transform-style: preserve-3d;
}

/* Desktop: book with shadow and border radius */
@media (min-width: 600px) {
  .book {
    border-radius: 4px;
    box-shadow:
      0 20px 60px rgba(60, 40, 30, 0.18),
      0 6px 20px rgba(60, 40, 30, 0.1),
      0 0 0 1px rgba(60, 40, 30, 0.04);
    height: min(94dvh, 860px);
  }
}

/* Mobile: fill screen edge to edge */
@media (max-width: 599px) {
  html, body { background: var(--ivory); }
  body { align-items: stretch; justify-content: stretch; }
  .book-scene { width: 100vw; height: 100dvh; }
  .book { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; border-radius: 0; }
}

/* ==================== PAGE BASE ==================== */
.page {
  position: absolute;
  inset: 0;
  transform-origin: left center;
  transform-style: preserve-3d;
  backface-visibility: hidden;
  background: var(--ivory);
  overflow: hidden;
  will-change: transform;
}

@media (min-width: 600px) {
  .page { border-radius: 4px; }
}

/* Paper texture */
.page::before {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 50;
  opacity: 0.025;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 200px 200px;
}

/* Page stacking: 3 on top, 2 middle, 1 bottom */
.page-1 { z-index: 30; }
.page-2 { z-index: 20; }
.page-3 { z-index: 10; }

/* Page edge shadow (right side — like a book spine shadow) */
.page::after {
  content: '';
  position: absolute;
  top: 0; right: 0; bottom: 0;
  width: 30px;
  background: linear-gradient(to left, rgba(60,40,30,0.06), transparent);
  pointer-events: none;
  z-index: 40;
}

/* Turning animation */
.page.turning-forward {
  animation: turnForward 1.4s cubic-bezier(0.4, 0.0, 0.2, 1) forwards;
}
.page.turning-backward {
  animation: turnBackward 1.4s cubic-bezier(0.4, 0.0, 0.2, 1) forwards;
}
.page.turned {
  transform: rotateY(-180deg);
  pointer-events: none;
}
.page.turned::after { opacity: 0; }

@keyframes turnForward {
  0% { transform: rotateY(0deg); }
  100% { transform: rotateY(-180deg); }
}
@keyframes turnBackward {
  0% { transform: rotateY(-180deg); }
  100% { transform: rotateY(0deg); }
}

/* Shadow that appears during turn */
.turn-shadow {
  position: absolute;
  top: 0; left: 0; bottom: 0;
  width: 60px;
  background: linear-gradient(to right, rgba(60,40,30,0.12), transparent);
  z-index: 5;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.turn-shadow.visible { opacity: 1; }

/* ==================== ORNAMENTAL SVGs ==================== */
.corner-ornament {
  position: absolute;
  width: 55px;
  height: 55px;
  opacity: 0.2;
  z-index: 2;
  pointer-events: none;
}
.corner-ornament svg { width: 100%; height: 100%; }
.corner-tl { top: 14px; left: 14px; }
.corner-tr { top: 14px; right: 14px; transform: scaleX(-1); }
.corner-bl { bottom: 14px; left: 14px; transform: scaleY(-1); }
.corner-br { bottom: 14px; right: 14px; transform: scale(-1,-1); }

/* ==================== PAGE INNER BORDER ==================== */
.page-border {
  position: absolute;
  inset: 10px;
  border: 0.5px solid var(--gold-faint);
  pointer-events: none;
  z-index: 2;
}

/* ==================== NAVIGATION ==================== */
.page-footer {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px 14px calc(16px + env(safe-area-inset-bottom, 0px));
  gap: 8px;
  flex-shrink: 0;
  margin-top: auto;
}

/* Page indicator */
.page-indicator {
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  color: var(--text);
}

.page-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  pointer-events: auto;
}

.nav-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(106, 130, 92, 0.15);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(106, 130, 92, 0.3);
  padding: 10px 18px;
  border-radius: 100px;
  cursor: pointer;
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 0.65rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #3D5A32;
  transition: all 0.3s ease;
  min-height: 44px;
  white-space: nowrap;
  box-shadow: 0 2px 8px rgba(106, 130, 92, 0.1);
}
.nav-btn:hover, .nav-btn:focus-visible {
  background: rgba(106, 130, 92, 0.25);
  border-color: rgba(106, 130, 92, 0.4);
  outline: none;
}
.nav-btn:active { transform: scale(0.97); }
.nav-btn .arrow { transition: transform 0.3s ease; }
.nav-btn:hover .arrow-right { transform: translateX(2px); }
.nav-btn:hover .arrow-left { transform: translateX(-2px); }

.nav-btn.hidden { visibility: hidden; pointer-events: none; }

/* Cover page: button is in flow, not in .page-nav */

/* ==================== PAGE 1 — COVER ==================== */
.page-1-layout {
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 3;
}
.cover-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px 24px 8px;
  gap: 12px;
  min-height: 0;
}
.cover-footer {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 6px 20px calc(16px + env(safe-area-inset-bottom, 0px));
  flex-shrink: 0;
}

.cover-motif {
  width: 50px;
  height: auto;
  opacity: 0.35;
  color: var(--gold-light);
  flex-shrink: 0;
}

.cover-names {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(2rem, 6.5vw, 2.8rem);
  color: var(--maroon);
  letter-spacing: 0.04em;
  line-height: 1.15;
  text-wrap: balance;
}
.cover-names .ampersand {
  font-style: italic;
  font-weight: 300;
  color: var(--gold);
  display: block;
  font-size: 0.65em;
  margin: 2px 0;
}

.cover-photo-frame {
  width: min(55vw, 240px);
  aspect-ratio: 3 / 4;
  border-radius: 160px 160px 8px 8px;
  overflow: hidden;
  border: 0.5px solid var(--gold-light);
  box-shadow: 0 6px 24px rgba(60,40,30,0.1);
  flex-shrink: 1;
  min-height: 0;
}
.cover-photo-frame img {
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center 20%;
  display: block;
}

.cover-ornament-line {
  width: 40px;
  height: 0.5px;
  background: var(--gold-light);
  flex-shrink: 0;
}

.cover-invitation-text {
  font-family: var(--font-display);
  font-weight: 500;
  font-style: italic;
  font-size: clamp(0.9rem, 2.5vw, 1.05rem);
  color: var(--text-light);
  line-height: 1.65;
  max-width: 280px;
  text-wrap: balance;
}

.cover-date {
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 0.75rem;
  letter-spacing: 0.25em;
  color: var(--gold-dark);
  text-transform: uppercase;
}

/* ==================== PAGE 2 — CELEBRATIONS ==================== */
.page-2-content {
  height: 100%;
  display: flex;
  flex-direction: column;
  padding: 24px 20px 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}

.page-2-header {
  text-align: center;
  padding-bottom: 16px;
  flex-shrink: 0;
}
.page-2-header .eyebrow {
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 0.6rem;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--gold-dark);
  margin-bottom: 6px;
}
.page-2-header h2 {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(1.4rem, 4.5vw, 1.9rem);
  color: var(--maroon);
  letter-spacing: 0.04em;
}
.header-rule {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-top: 10px;
}
.header-rule .line { width: 30px; height: 0.5px; background: var(--gold-faint); }
.header-rule .dot { width: 4px; height: 4px; border: 0.5px solid var(--gold-faint); transform: rotate(45deg); flex-shrink: 0; }

/* Events on page 2 — editorial, each unique */
.p2-events {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* Event: Haldi — large image, text below */
.evt-haldi {
  text-align: center;
}
.evt-haldi .evt-img {
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: 3px;
  overflow: hidden;
}
.evt-haldi .evt-img img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.evt-haldi .evt-meta {
  padding-top: 10px;
}

/* Event: Mehendi — offset composition */
.evt-mehendi {
  display: grid;
  grid-template-columns: 1fr 1.1fr;
  gap: 14px;
  align-items: center;
}
.evt-mehendi .evt-meta { text-align: left; }
.evt-mehendi .evt-img {
  aspect-ratio: 4 / 5;
  border-radius: 3px;
  overflow: hidden;
}
.evt-mehendi .evt-img img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}

/* Event: Devpoojan — image left, text right */
.evt-devpoojan {
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: 14px;
  align-items: center;
}
.evt-devpoojan .evt-img {
  aspect-ratio: 4 / 5;
  border-radius: 3px;
  overflow: hidden;
}
.evt-devpoojan .evt-img img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.evt-devpoojan .evt-meta { text-align: left; }

/* Event meta shared styles */
.evt-date {
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 0.6rem;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--gold-dark);
  margin-bottom: 2px;
}
.evt-title {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(1.1rem, 3.2vw, 1.35rem);
  color: var(--maroon);
  letter-spacing: 0.05em;
  margin-bottom: 3px;
}
.evt-desc {
  font-family: var(--font-display);
  font-weight: 400;
  font-style: italic;
  font-size: clamp(0.8rem, 2.2vw, 0.9rem);
  color: var(--text-light);
  line-height: 1.5;
}

/* Small ornamental dividers between events */
.evt-divider {
  display: flex;
  justify-content: center;
  padding: 2px 0;
  flex-shrink: 0;
}
.evt-divider svg { width: 30px; height: 8px; opacity: 0.25; color: var(--gold); }

/* ==================== PAGE 3 — MAIN CELEBRATIONS ==================== */
.page-3-content {
  height: 100%;
  display: flex;
  flex-direction: column;
  padding: 24px 20px 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}

.page-3-header {
  text-align: center;
  padding-bottom: 14px;
  flex-shrink: 0;
}
.page-3-header .eyebrow {
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 0.6rem;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--gold-dark);
  margin-bottom: 6px;
}
.page-3-header h2 {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(1.4rem, 4.5vw, 1.9rem);
  color: var(--maroon);
  letter-spacing: 0.04em;
}

.p3-events {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* Wedding — hero treatment */
.evt-wedding {
  text-align: center;
  position: relative;
}
.evt-wedding .evt-img {
  width: 100%;
  aspect-ratio: 16 / 10;
  border-radius: 3px;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(60,40,30,0.1), 0 0 0 0.5px var(--gold-faint);
}
.evt-wedding .evt-img img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.evt-wedding .evt-meta { padding-top: 12px; }
.evt-wedding .evt-date { font-size: 0.65rem; font-weight: 500; color: var(--gold-dark); }
.evt-wedding .evt-title {
  font-size: clamp(1.25rem, 3.5vw, 1.6rem);
  position: relative;
}
.evt-wedding .evt-title::after {
  content: '';
  display: block;
  width: 24px;
  height: 0.5px;
  background: var(--gold);
  margin: 6px auto 0;
}

/* Reception — slightly more compact */
.evt-reception {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 14px;
  align-items: center;
}
.evt-reception .evt-img {
  aspect-ratio: 4 / 5;
  border-radius: 3px;
  overflow: hidden;
}
.evt-reception .evt-img img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.evt-reception .evt-meta { text-align: left; }

/* Closing message */
.closing {
  text-align: center;
  padding-top: 12px;
  flex-shrink: 0;
}
.closing-line {
  font-family: var(--font-display);
  font-weight: 500;
  font-style: italic;
  font-size: clamp(0.95rem, 2.5vw, 1.1rem);
  color: var(--text-light);
  margin-bottom: 10px;
}
.closing-names {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(0.85rem, 2.2vw, 1rem);
  color: var(--maroon);
  line-height: 1.6;
}
.closing-names .with-love {
  display: block;
  font-weight: 400;
  font-style: italic;
  font-size: 0.85em;
  color: var(--text-light);
  margin-bottom: 2px;
}
.closing-ornament {
  margin-top: 10px;
}
.closing-ornament svg { width: 36px; height: 10px; opacity: 0.2; color: var(--gold); }

/* ==================== SCROLL HINT ==================== */
.scroll-hint {
  position: absolute;
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  z-index: 35;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
}
.scroll-hint.visible {
  opacity: 1;
}
.scroll-hint-text {
  font-family: var(--font-body);
  font-weight: 400;
  font-size: 0.55rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gold);
}
.scroll-hint-arrow {
  font-size: 0.85rem;
  color: var(--gold);
  animation: scrollBounce 1.8s ease-in-out infinite;
}
@keyframes scrollBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(5px); }
}

/* ==================== MUSIC CONTROL ==================== */
.music-toggle {
  position: fixed;
  top: 14px;
  right: 14px;
  z-index: 100;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  border: 0.5px solid var(--gold-faint);
  background: rgba(250, 247, 242, 0.65);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  cursor: pointer;
  color: var(--gold);
  font-size: 13px;
  transition: all 0.3s ease;
  opacity: 0;
  pointer-events: none;
}
.music-toggle.visible {
  opacity: 1;
  pointer-events: auto;
}
.music-toggle:hover {
  background: rgba(196, 162, 101, 0.12);
  border-color: var(--gold);
}
.music-toggle:active { transform: scale(0.92); }

/* Animated sound bars when playing */
.music-toggle .bars {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  height: 12px;
}
.music-toggle .bars span {
  display: block;
  width: 2px;
  background: var(--gold);
  border-radius: 1px;
  transition: height 0.2s ease;
}
.music-toggle.playing .bars span {
  animation: barPulse 0.8s ease-in-out infinite alternate;
}
.music-toggle.playing .bars span:nth-child(1) { animation-delay: 0s; height: 4px; }
.music-toggle.playing .bars span:nth-child(2) { animation-delay: 0.15s; height: 8px; }
.music-toggle.playing .bars span:nth-child(3) { animation-delay: 0.3s; height: 5px; }

.music-toggle:not(.playing) .bars span {
  height: 3px !important;
  opacity: 0.5;
  animation: none;
}

@keyframes barPulse {
  0% { height: 3px; }
  50% { height: 10px; }
  100% { height: 5px; }
}

/* Safe area offset on mobile */
@supports (padding: env(safe-area-inset-top)) {
  .music-toggle {
    top: calc(14px + env(safe-area-inset-top, 0px));
    right: calc(14px + env(safe-area-inset-right, 0px));
  }
}

/* ==================== REDUCED MOTION ==================== */
@media (prefers-reduced-motion: reduce) {
  .page.turning-forward,
  .page.turning-backward {
    animation-duration: 0.01s;
  }
  .nav-btn .arrow { transition: none; }
}

/* ==================== SMALL PHONES ==================== */
@media (max-height: 700px) {
  .cover-content { gap: 6px; padding-top: 12px; }
  .cover-photo-frame { width: min(45vw, 180px); }
  .cover-names { font-size: clamp(1.6rem, 5.5vw, 2.2rem); }
  .cover-motif { width: 36px; }
  .p2-events { gap: 8px; }
  .p3-events { gap: 8px; }
  .evt-haldi .evt-img { aspect-ratio: 2 / 1; }
}
</style>
</head>
<body>

<svg hidden>
  <symbol id="floral-corner" viewBox="0 0 100 100">
    <path d="M5,5 Q5,50 30,70 Q15,50 15,25 Q15,10 25,5 Z" fill="none" stroke="currentColor" stroke-width="0.6" opacity="0.7"/>

<script>
// ==================== CENTRALIZED CONFIG ====================
const weddingData = {
  brideName: "Rutbi",
  groomName: "Harsh",
  weddingDate: "9 December 2026",
  invitationText: "Together with our families,\nwe invite you to celebrate\nthe beginning of our forever.",
  coverImage: "images/cover.jpg",

  events: [
    {
      title: "Haldi",
      date: "6 December 2026",
      image: "images/haldi.jpg",
      description: "A morning filled with sunshine, laughter and haldi."
    },
    {
      title: "Mehendi & Sangeet",
      date: "7 December 2026",
      image: "images/mehendi-sangeet.jpg",
      description: "An evening of music, celebration and togetherness."
    },
    {
      title: "Devpoojan",
      date: "8 December 2026",
      image: "images/devpoojan.jpg",
      description: "A beautiful beginning with blessings and traditions."
    },
    {
      title: "Wedding",
      date: "9 December 2026",
      image: "images/wedding.jpg",
      description: "The day we begin our forever.",
      isHero: true
    },
    {
      title: "Reception",
      date: "11 December 2026",
      image: "images/reception.jpg",
      description: "An evening to celebrate love, family and new beginnings."
    }
  ],

  closingMessage: "And so begins our forever.",
  closingSignoff: "With love,"
};

// ==================== FORMAT HELPERS ====================
function fmtDate(dateStr) {
  const p = dateStr.split(' ');
  return p[0].padStart(2,'0') + ' ' + p[1].toUpperCase() + ' ' + p[2];
}

// ==================== POPULATE ====================
function populate() {
  const d = weddingData;

  // Cover
  document.getElementById('coverNames').innerHTML =
    d.groomName + '<span class="ampersand">&</span>' + d.brideName;
  document.getElementById('coverImg').src = d.coverImage;
  document.getElementById('coverText').innerHTML = d.invitationText.replace(/\n/g,'<br>');
  document.getElementById('coverDate').textContent = d.weddingDate;

  // Page 2: first 3 events with unique layouts
  const p2 = document.getElementById('p2Events');
  const layouts = ['haldi','mehendi','devpoojan'];
  d.events.slice(0,3).forEach((evt, i) => {
    const cls = layouts[i];
    let html = '';
    if (cls === 'haldi') {
      html = `
        <div class="evt-haldi">
          <div class="evt-img"><img src="${evt.image}" alt="${evt.title}" loading="lazy"></div>
          <div class="evt-meta">
            <p class="evt-date">${fmtDate(evt.date)}</p>
            <h3 class="evt-title">${evt.title}</h3>
            <p class="evt-desc">${evt.description}</p>
          </div>
        </div>`;
    } else if (cls === 'mehendi') {
      html = `
        <div class="evt-mehendi">
          <div class="evt-meta">
            <p class="evt-date">${fmtDate(evt.date)}</p>
            <h3 class="evt-title">${evt.title}</h3>
            <p class="evt-desc">${evt.description}</p>
          </div>
          <div class="evt-img"><img src="${evt.image}" alt="${evt.title}" loading="lazy"></div>
        </div>`;
    } else {
      html = `
        <div class="evt-devpoojan">
          <div class="evt-img"><img src="${evt.image}" alt="${evt.title}" loading="lazy"></div>
          <div class="evt-meta">
            <p class="evt-date">${fmtDate(evt.date)}</p>
            <h3 class="evt-title">${evt.title}</h3>
            <p class="evt-desc">${evt.description}</p>
          </div>
        </div>`;
    }
    if (i < 2) {
      html += '<div class="evt-divider"><svg><use href="#leaf-divider"/></svg></div>';
    }
    p2.insertAdjacentHTML('beforeend', html);
  });

  // Page 3: Wedding + Reception
  const p3 = document.getElementById('p3Events');
  const wedding = d.events[3];
  const reception = d.events[4];

  p3.innerHTML = `
    <div class="evt-wedding">
      <div class="evt-img"><img src="${wedding.image}" alt="${wedding.title}" loading="lazy"></div>
      <div class="evt-meta">
        <p class="evt-date">${fmtDate(wedding.date)}</p>
        <h3 class="evt-title">${wedding.title}</h3>
        <p class="evt-desc">${wedding.description}</p>
      </div>
    </div>
    <div class="evt-divider"><svg><use href="#leaf-divider"/></svg></div>
    <div class="evt-reception">
      <div class="evt-img"><img src="${reception.image}" alt="${reception.title}" loading="lazy"></div>
      <div class="evt-meta">
        <p class="evt-date">${fmtDate(reception.date)}</p>
        <h3 class="evt-title">${reception.title}</h3>
        <p class="evt-desc">${reception.description}</p>
      </div>
    </div>`;

  // Closing
  const closing = document.getElementById('closingSection');
  closing.innerHTML = `
    <div class="cover-ornament-line" style="margin:0 auto 12px"></div>
    <p class="closing-line">${d.closingMessage}</p>
    <p class="closing-names">
      <span class="with-love">${d.closingSignoff}</span>
      ${d.groomName} <span style="font-style:italic;color:var(--gold)">&</span> ${d.brideName}
    </p>
    <div class="closing-ornament"><svg><use href="#leaf-divider"/></svg></div>`;
}

// ==================== AUDIO CONFIG ====================
const audioAssets = {
  backgroundMusic: "audio/wedding-music.mp3",
  pageTurn: "audio/page-turn.mp3"
};

const audioState = {
  musicEnabled: false,
  musicInitialized: false,
  musicVolume: 0.1,
  pageTurnVolume: 0.25
};

let bgMusic = null;
let pageTurnSound = null;
const musicToggle = document.getElementById('musicToggle');

// Pre-load audio elements
function initAudioElements() {
  bgMusic = new Audio(audioAssets.backgroundMusic);
  bgMusic.loop = true;
  bgMusic.volume = 0;
  bgMusic.preload = 'auto';

  pageTurnSound = new Audio(audioAssets.pageTurn);
  pageTurnSound.preload = 'auto';
  pageTurnSound.volume = audioState.pageTurnVolume;
}

// Start music with gentle fade-in
function startMusic() {
  if (!bgMusic || audioState.musicInitialized) return;
  audioState.musicInitialized = true;
  audioState.musicEnabled = true;

  bgMusic.volume = 0;
  const playPromise = bgMusic.play();
  if (playPromise !== undefined) {
    playPromise.then(() => {
      // Fade in over 1.5s
      fadeAudio(bgMusic, 0, audioState.musicVolume, 1500);
      musicToggle.classList.add('visible', 'playing');
    }).catch(() => {
      // Browser blocked — keep going silently
      audioState.musicEnabled = false;
      audioState.musicInitialized = false;
    });
  }
}

// Smooth volume fade
function fadeAudio(audio, from, to, duration) {
  const steps = 30;
  const stepTime = duration / steps;
  const stepVal = (to - from) / steps;
  let current = from;
  let step = 0;
  const interval = setInterval(() => {
    step++;
    current += stepVal;
    audio.volume = Math.max(0, Math.min(1, current));
    if (step >= steps) {
      audio.volume = Math.max(0, Math.min(1, to));
      clearInterval(interval);
    }
  }, stepTime);
}

// Toggle music on/off
function toggleMusic() {
  if (!bgMusic) return;
  if (audioState.musicEnabled) {
    fadeAudio(bgMusic, bgMusic.volume, 0, 400);
    setTimeout(() => { bgMusic.pause(); }, 450);
    audioState.musicEnabled = false;
    musicToggle.classList.remove('playing');
  } else {
    bgMusic.play().then(() => {
      fadeAudio(bgMusic, 0, audioState.musicVolume, 600);
      audioState.musicEnabled = true;
      musicToggle.classList.add('playing');
    }).catch(() => {});
  }
}

musicToggle.addEventListener('click', (e) => {
  e.stopPropagation();
  toggleMusic();
});

// Play page-turn sound
function playPageTurnSound() {
  if (!pageTurnSound) return;
  try {
    // Clone for overlapping plays
    const sound = pageTurnSound.cloneNode();
    sound.volume = audioState.pageTurnVolume;
    sound.play().catch(() => {});
  } catch(e) {}
}

// Pause/resume music when tab loses/gains focus
let musicWasPlayingBeforeHidden = false;
document.addEventListener('visibilitychange', () => {
  if (!bgMusic) return;
  if (document.hidden) {
    // Tab lost focus — remember state and pause
    musicWasPlayingBeforeHidden = audioState.musicEnabled && !bgMusic.paused;
    if (musicWasPlayingBeforeHidden) {
      bgMusic.pause();
    }
  } else {
    // Tab regained focus — resume if it was playing before
    if (musicWasPlayingBeforeHidden && audioState.musicEnabled) {
      bgMusic.play().catch(() => {});
    }
    musicWasPlayingBeforeHidden = false;
  }
});

// Initialize audio elements early (but don't play)
try { initAudioElements(); } catch(e) {}

// ==================== PAGE TURN ENGINE ====================
let currentPage = 1;
let isTurning = false;
const TURN_DURATION = 1400;

const page1 = document.getElementById('page1');
const page2 = document.getElementById('page2');
const page3 = document.getElementById('page3');
const shadow = document.getElementById('turnShadow');

function goForward() {
  if (isTurning || currentPage >= 3) return;
  isTurning = true;

  const turningPage = currentPage === 1 ? page1 : page2;

  // Start music on first interaction
  if (!audioState.musicInitialized) startMusic();

  // Play page-turn sound
  playPageTurnSound();

  // Show shadow
  shadow.classList.add('visible');

  // Start turn
  turningPage.classList.add('turning-forward');

  turningPage.addEventListener('animationend', function handler() {
    turningPage.removeEventListener('animationend', handler);
    turningPage.classList.remove('turning-forward');
    turningPage.classList.add('turned');
    shadow.classList.remove('visible');
    currentPage++;
    isTurning = false;
  });
}

function goBackward() {
  if (isTurning || currentPage <= 1) return;
  isTurning = true;

  const turningPage = currentPage === 2 ? page1 : page2;

  // Play page-turn sound
  playPageTurnSound();

  shadow.classList.add('visible');

  turningPage.classList.remove('turned');
  turningPage.classList.add('turning-backward');

  turningPage.addEventListener('animationend', function handler() {
    turningPage.removeEventListener('animationend', handler);
    turningPage.classList.remove('turning-backward');
    shadow.classList.remove('visible');
    currentPage--;
    isTurning = false;
  });
}

// ==================== BUTTON WIRING ====================
document.getElementById('nextBtn1').addEventListener('click', goForward);
document.getElementById('nextBtn2').addEventListener('click', goForward);
document.getElementById('backBtn2').addEventListener('click', goBackward);
document.getElementById('backBtn3').addEventListener('click', goBackward);

// ==================== SWIPE SUPPORT ====================
let touchStartX = 0;
let touchStartY = 0;

document.getElementById('book').addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

document.getElementById('book').addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > 60 && Math.abs(dy) < Math.abs(dx)) {
    if (dx < 0) goForward();
    else goBackward();
  }
}, { passive: true });

// ==================== SCROLL HINTS ====================
function initScrollHints() {
  const pages = [
    { content: document.querySelector('.page-2-content'), hint: document.querySelector('.scroll-hint[data-for="page2"]') },
    { content: document.querySelector('.page-3-content'), hint: document.querySelector('.scroll-hint[data-for="page3"]') }
  ];

  pages.forEach(({ content, hint }) => {
    if (!content || !hint) return;

    function checkScroll() {
      const isScrollable = content.scrollHeight > content.clientHeight + 10;
      const isNearBottom = content.scrollTop + content.clientHeight >= content.scrollHeight - 30;
      if (isScrollable && !isNearBottom) {
        hint.classList.add('visible');
      } else {
        hint.classList.remove('visible');
      }
    }

    content.addEventListener('scroll', checkScroll, { passive: true });

    // Check whenever a page turn completes (content may now be visible)
    const observer = new MutationObserver(() => {
      setTimeout(checkScroll, 100);
    });
    observer.observe(content.closest('.page'), { attributes: true, attributeFilter: ['class'] });

    // Initial check after a short delay (content populated dynamically)
    setTimeout(checkScroll, 500);
  });
}

// ==================== INIT ====================
populate();
initScrollHints();
</script>
